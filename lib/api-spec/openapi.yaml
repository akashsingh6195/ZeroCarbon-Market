openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ZeroCarbon Market demo API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current demo session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
    delete:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganisationInput"}
      responses:
        "200":
          description: Demo organisation created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
  /listings:
    get:
      operationId: getListings
      parameters:
        - {name: market, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: vintage_from, in: query, schema: {type: integer}}
        - {name: max_price, in: query, schema: {type: number}}
        - {name: region, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200":
          description: Role-filtered visible demo listings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Listing"}
  /listings/{id}:
    get:
      operationId: getListing
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Listing details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Listing"}
  /market-summary:
    get:
      operationId: getMarketSummary
      responses:
        "200":
          description: Role-filtered marketplace totals
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MarketSummary"}
  /need:
    post:
      operationId: interpretNeed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NeedInput"}
      responses:
        "200":
          description: Assistant results or explicit unavailability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NeedResult"}
  /claim-check:
    post:
      operationId: checkClaim
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimInput"}
      responses:
        "200":
          description: Safe wording
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClaimResult"}
  /orders:
    get:
      operationId: getOrders
      responses:
        "200":
          description: Organisation orders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Order"}
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderInput"}
      responses:
        "201":
          description: Demo order placed without any money movement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
  /plan-interest:
    post:
      operationId: recordPlanInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanInterest"}
      responses:
        "200":
          description: Interest recorded without a payment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Order and current demo stages
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
  /orders/{id}/question:
    post:
      operationId: askOrder
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionInput"}
      responses:
        "200":
          description: Concierge answer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Answer"}
  /certificates/{token}:
    get:
      operationId: getCertificate
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Public demo certificate
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
  /scan:
    post:
      operationId: scanLand
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanInput"}
      responses:
        "200":
          description: Scan result or explicit model-service failure
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanResult"}
  /ask:
    post:
      operationId: askZeroCarbon
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionInput"}
      responses:
        "200":
          description: Answer or explicit unavailability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Answer"}
  /live:
    get:
      operationId: getLiveStats
      responses:
        "200":
          description: Demo event counters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveStats"}
  /visits:
    post:
      operationId: recordVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VisitInput"}
      responses:
        "200":
          description: Visit recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /admin/login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminCredentials"}
      responses:
        "200":
          description: PIN accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /admin:
    get:
      operationId: getAdminDashboard
      responses:
        "200":
          description: PIN-protected admin dashboard
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminDashboard"}
  /admin/listings/{id}:
    patch:
      operationId: updateListingVisibility
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ListingVisibility"}
      responses:
        "200":
          description: Visibility updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Listing"}
  /land-reviews:
    get:
      operationId: getLandReviews
      responses:
        "200":
          description: Land reviews belonging to the signed-in organisation
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/LandReview"}}
    post:
      operationId: createLandReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_token]
              properties:
                scan_token: {type: string, minLength: 1, maxLength: 50000}
      responses:
        "201":
          description: Booking created; payment still awaits team confirmation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LandReview"}
  /land-reviews/{id}:
    get:
      operationId: getLandReview
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Private land review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LandReview"}
  /land-reviews/{id}/decision:
    post:
      operationId: decideLandReview
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [accept, refund]}
                reason: {type: string, maxLength: 2000}
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LandReview"}
  /land-reviews/{id}/proposal-file:
    get:
      operationId: downloadLandReviewProposal
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Private proposal PDF, only for its owner or an authenticated administrator
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /admin/land-reviews:
    get:
      operationId: getAdminLandReviews
      responses:
        "200":
          description: Private land-review operations and separate revenue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminLandReviews"}
  /admin/land-reviews/{id}:
    patch:
      operationId: updateAdminLandReview
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [form_filled, mark_paid, schedule, visited, proposal, refund, mark_refunded]}
                form_filled: {type: boolean}
                payment_utr: {type: string, minLength: 6, maxLength: 80}
                refund_utr: {type: string, minLength: 6, maxLength: 80}
                visit_date: {type: string, format: date}
                field_partner: {type: string, minLength: 1, maxLength: 120}
                proposal_text: {type: string, minLength: 1, maxLength: 20000}
                proposal_file: {type: string, maxLength: 500}
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LandReview"}
  /admin/land-reviews/{id}/proposal-upload:
    post:
      operationId: requestLandReviewProposalUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, content_type]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                size: {type: integer, minimum: 1, maximum: 5242880}
                content_type: {type: string, enum: [application/pdf]}
      responses:
        "200":
          description: Admin-only direct-to-storage upload
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, object_path]
                properties:
                  upload_url: {type: string}
                  object_path: {type: string}
  /internal/listings:
    get:
      operationId: getInternalListings
      parameters:
        - {name: X-Internal-Key, in: header, required: true, schema: {type: string}}
      responses:
        "200":
          description: Key-protected visible listings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Listing"}
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string}
    Message:
      type: object
      required: [message]
      properties:
        message: {type: string}
    OrganisationInput:
      type: object
      required: [name, phone, organisation_name, roles]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, minLength: 10, maxLength: 16}
        organisation_name: {type: string, minLength: 1, maxLength: 160}
        roles:
          type: array
          minItems: 1
          items: {type: string, enum: [Buyer, Seller, Trader]}
        buyer_type: {type: string, enum: [voluntary, obligated]}
        seller_type: {type: string, enum: [land, project, credits]}
    Organisation:
      type: object
      required: [id, name, phone, organisation_name, roles, buyer_type]
      properties:
        id: {type: string}
        name: {type: string}
        phone: {type: string}
        organisation_name: {type: string}
        roles:
          type: array
          items: {type: string}
        buyer_type: {type: string}
    Session:
      type: object
      required: [organisation, next_screen]
      properties:
        organisation:
          oneOf:
            - {$ref: "#/components/schemas/Organisation"}
            - {type: "null"}
        next_screen: {type: string}
    Listing:
      type: object
      required: [id, project_name, region, market, action, status, vintage, registry, method, price_inr_per_t, quantity_t, delivery_year, zerocarbon_score, lat, lon, description, hidden, demo]
      properties:
        id: {type: integer}
        project_name: {type: string}
        region: {type: string}
        market: {type: string, enum: [india_compliance, india_offset, voluntary, authorised]}
        action: {type: string, enum: [removal, reduction, avoidance]}
        status: {type: string, enum: [future, issued, retired]}
        vintage: {type: integer}
        registry: {type: string}
        method: {type: string}
        price_inr_per_t: {type: number}
        quantity_t: {type: number}
        delivery_year: {type: [integer, "null"]}
        zerocarbon_score: {type: integer}
        seller_org_id: {type: [string, "null"]}
        lat: {type: number}
        lon: {type: number}
        description: {type: string}
        hidden: {type: boolean}
        demo: {type: boolean}
    MarketSummary:
      type: object
      required: [listings, available_tonnes, regions, min_price, max_price]
      properties:
        listings: {type: integer}
        available_tonnes: {type: number}
        regions: {type: integer}
        min_price: {type: number}
        max_price: {type: number}
    NeedInput:
      type: object
      required: [sentence]
      properties:
        sentence: {type: string, minLength: 1, maxLength: 1000}
    NeedResult:
      type: object
      required: [available, message, understood, filters, ranked]
      properties:
        available: {type: boolean}
        message: {type: string}
        understood: {type: string}
        filters:
          type: object
          additionalProperties: true
        ranked:
          type: array
          items: {$ref: "#/components/schemas/RankedListing"}
    RankedListing:
      type: object
      required: [listing, why]
      properties:
        listing: {$ref: "#/components/schemas/Listing"}
        why: {type: string}
    ClaimInput:
      type: object
      required: [listing_id, quantity_t, claim_text]
      properties:
        listing_id: {type: integer}
        quantity_t: {type: number, exclusiveMinimum: 0}
        claim_text: {type: string, maxLength: 2000}
    ClaimResult:
      type: object
      required: [allowed_wording, flagged_phrases, fallback]
      properties:
        allowed_wording: {type: string}
        flagged_phrases:
          type: array
          items: {type: string}
        fallback: {type: boolean}
    OrderInput:
      type: object
      required: [listing_id, quantity_t, claim_text, demo_payment_approved]
      properties:
        listing_id: {type: integer}
        quantity_t: {type: number, exclusiveMinimum: 0}
        claim_text: {type: string, maxLength: 2000}
        demo_payment_approved: {type: boolean}
    Order:
      type: object
      required: [id, listing, quantity_t, price_inr_per_t, fee_rate, fee_inr, fee_status, route, stage, stages, stages_done, claim_text, certificate_token, created_at, demo]
      properties:
        id: {type: string}
        listing: {$ref: "#/components/schemas/Listing"}
        quantity_t: {type: number}
        price_inr_per_t: {type: number}
        fee_rate: {type: number}
        fee_inr: {type: integer}
        fee_status: {type: string, enum: [pending, earned, none, cancelled]}
        route: {type: string}
        stage: {type: string}
        stages:
          type: array
          items: {type: string}
        stages_done:
          type: array
          items: {type: string}
        claim_text: {type: string}
        certificate_token: {type: string}
        created_at: {type: string}
        demo: {type: boolean}
    Certificate:
      type: object
      required: [token, project_name, tonnes, vintage, text, serial_numbers, issued_at, demo]
      properties:
        token: {type: string}
        project_name: {type: string}
        tonnes: {type: number}
        vintage: {type: integer}
        text: {type: string}
        serial_numbers:
          type: array
          items: {type: string}
        issued_at: {type: string}
        demo: {type: boolean}
    QuestionInput:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}
        screen: {type: string}
        role: {type: string}
    Answer:
      type: object
      required: [answer, see_screen, escalate, available]
      properties:
        answer: {type: string}
        see_screen: {type: string}
        escalate: {type: boolean}
        available: {type: boolean}
    ScanInput:
      type: object
      required: [lat, lon]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        boundary_geojson:
          type: object
          additionalProperties: true
    ScanResult:
      type: object
      required: [available, message]
      properties:
        available: {type: boolean}
        message: {type: string}
        verdict: {type: string, enum: [likely_eligible, needs_checks, not_eligible]}
        review_token: {type: string}
        headline: {type: string}
        reasons:
          type: array
          items: {type: string}
        what_to_plant: {type: string}
        credits_line: {type: string}
        money_line: {type: string}
        next_step: {type: string}
        limitations: {type: string}
    LandReview:
      type: object
      required: [id, booking_id, name, phone, lat, lon, boundary_geojson, scan_json, form_filled, price_inr, payment_mode, payment_provider, status, field_partner, visit_date, proposal_text, proposal_file, proposal_sent_at, refund_reason, created_at, paid_at, refunded_at, form_url, upi_id, refund_deadline, can_refund, no_visit_refund, payment_utr, refund_utr]
      properties:
        id: {type: integer}
        booking_id: {type: string}
        name: {type: string}
        phone: {type: string}
        lat: {type: number}
        lon: {type: number}
        boundary_geojson: {type: [object, "null"], additionalProperties: true}
        scan_json: {type: object, additionalProperties: true}
        form_filled: {type: boolean}
        price_inr: {type: integer}
        payment_mode: {type: string, enum: [demo, real]}
        payment_provider: {type: string, enum: [manual_upi, pinelabs, demo]}
        status: {type: string, enum: [awaiting_payment, paid, visit_scheduled, visited, proposal_ready, accepted, refund_requested, refunded, cancelled]}
        field_partner: {type: [string, "null"]}
        visit_date: {type: [string, "null"]}
        proposal_text: {type: [string, "null"]}
        proposal_file: {type: [string, "null"]}
        proposal_sent_at: {type: [string, "null"]}
        refund_reason: {type: [string, "null"]}
        created_at: {type: string}
        paid_at: {type: [string, "null"]}
        refunded_at: {type: [string, "null"]}
        form_url: {type: [string, "null"]}
        upi_id: {type: [string, "null"]}
        refund_deadline: {type: [string, "null"]}
        can_refund: {type: boolean}
        no_visit_refund: {type: boolean}
        payment_utr: {type: [string, "null"]}
        refund_utr: {type: [string, "null"]}
    LandReviewRevenue:
      type: object
      required: [paid_count, refunded_count, paid_inr, refunded_inr, net_inr]
      properties:
        paid_count: {type: integer}
        refunded_count: {type: integer}
        paid_inr: {type: integer}
        refunded_inr: {type: integer}
        net_inr: {type: integer}
    AdminLandReviews:
      type: object
      required: [reviews, revenue, payment_warning, form_responses_url]
      properties:
        reviews: {type: array, items: {$ref: "#/components/schemas/LandReview"}}
        revenue:
          type: object
          required: [demo, real]
          properties:
            demo: {$ref: "#/components/schemas/LandReviewRevenue"}
            real: {$ref: "#/components/schemas/LandReviewRevenue"}
        payment_warning: {type: [string, "null"]}
        form_responses_url: {type: [string, "null"]}
    LiveStats:
      type: object
      required: [signups, orders, tonnes_retired, scans, qr_visits, fees_earned_inr, demo]
      properties:
        signups: {type: integer}
        orders: {type: integer}
        tonnes_retired: {type: number}
        scans: {type: integer}
        qr_visits: {type: integer}
        fees_earned_inr: {type: integer}
        demo: {type: boolean}
    AdminRevenue:
      type: object
      required: [fees_earned_inr, fees_pending_inr, completed_voluntary_orders, credit_value_traded_inr, plan_interest_counts]
      properties:
        fees_earned_inr: {type: integer}
        fees_pending_inr: {type: integer}
        completed_voluntary_orders: {type: integer}
        credit_value_traded_inr: {type: number}
        plan_interest_counts:
          type: object
          additionalProperties: {type: integer}
    VisitInput:
      type: object
      properties:
        src: {type: string, maxLength: 100}
    PlanInterest:
      type: object
      required: [plan]
      properties:
        plan: {type: string, enum: [pool_starter, pool_essential, pool_growth, pool_enterprise, company_or_trader, due_diligence, comply_pro]}
        listing_id: {type: integer}
    AdminCredentials:
      type: object
      required: [pin]
      properties:
        pin: {type: string, minLength: 1, maxLength: 128}
    ListingVisibility:
      type: object
      required: [hidden]
      properties:
        hidden: {type: boolean}
    Event:
      type: object
      required: [id, kind, created_at, payload]
      properties:
        id: {type: integer}
        kind: {type: string}
        created_at: {type: string}
        payload: {type: object, additionalProperties: true}
    AdminDashboard:
      type: object
      required: [stats, listings, events, organisations, orders, integration_status, revenue]
      properties:
        stats: {$ref: "#/components/schemas/LiveStats"}
        listings:
          type: array
          items: {$ref: "#/components/schemas/Listing"}
        events:
          type: array
          items: {$ref: "#/components/schemas/Event"}
        organisations:
          type: array
          items: {$ref: "#/components/schemas/Organisation"}
        orders:
          type: array
          items: {$ref: "#/components/schemas/Order"}
        integration_status: {type: string}
        revenue: {$ref: "#/components/schemas/AdminRevenue"}
